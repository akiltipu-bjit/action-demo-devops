name: Hello Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      python-version:
        description: 'Python version to use'
        required: true
        default: '3.12'

permissions:
  contents: read

# Reusable workflows are called at the job level using local file paths.
jobs:
  lint:
    name: Pylint Check
    uses: ./.github/workflows/lint.yaml
    with:
      python-version: ${{ inputs.python-version || '3.12' }}

  test:
    name: Run tests
    uses: ./.github/workflows/test.yaml
    with:
      python-version: ${{ inputs.python-version || '3.12' }}

  security:
    name: Check code and dependency vulnerabilities
    uses: ./.github/workflows/security.yml
    with:
      python-version: ${{ inputs.python-version || '3.12' }}

  build:
    name: Build Python package
    needs: [lint, test, security]
    uses: ./.github/workflows/build.yml
    with:
      python-version: ${{ inputs.python-version || '3.12' }}

  publish:
    name: Publish build artifact
    needs: build
    uses: ./.github/workflows/publish.yml

