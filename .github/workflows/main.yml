name: Hello Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      python-version:
        description: 'Python version to use'
        required: true
        default: '3.12'

jobs:
  lint:
    name: Pylint Check
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ github.event.inputs.python-version }}
      - name: Install Pylint
        run: python -m pip install pylint
      - name: Check code quality
        run: pylint main.py test_main.py

  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ github.event.inputs.python-version }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run Hello World app
        run: python main.py
      - name: Run automated tests
        run: python -m pytest -v
 
  build:
    name: Build Python package
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tool
        run: python -m pip install build
      - name: Build wheel and source archive
        run: python -m build
 
      - name: Show build output
        run: ls -lh dist/
 
      - name: Save build for next job
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist/
          if-no-files-found: error
 
  publish:
    name: Publish build artifact
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve package from Build
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: dist/
      - name: Inspect retrieved package
        run: ls -lh dist/
      - name: Publish to GitHub Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hello-world-package
          path: dist/
          if-no-files-found: error

